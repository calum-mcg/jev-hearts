[project]
name = "jev-hearts"
version = "0.2.0"
description = "Proof of concept: a fast system-1 model (Jev) plays Hearts, visualised in one window"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "calum-mcg" }]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
jev = "jev_agent.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["hearts", "jev_agent", "ui"]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
